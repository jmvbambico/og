name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest pyyaml
      - run: pytest tests/ -v

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: syntax check
        run: bash -n bin/og && bash -n install.sh
      - name: shellcheck
        # -S error only: bin/og carries a handful of pre-existing style/info
        # findings (SC2034/SC2155/SC2012) that aren't worth blocking on here.
        # Real errors (the class of thing that actually breaks a run) still fail.
        run: shellcheck -S error bin/og install.sh
